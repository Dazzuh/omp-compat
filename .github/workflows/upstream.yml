name: upstream

# Same jobs as ci.yml, additionally run against the latest published OMP release.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  # Trusted: only this repo's fixtures run under the real omp binary. The third-party
  # benchmark gets static checks only (its omp-load is skipped: runtime-not-allowed).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Set cache dir
        shell: bash
        run: echo "OMP_COMPAT_CACHE=$RUNNER_TEMP/omp-compat" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/omp-compat
          key: omp-compat-${{ runner.os }}-${{ hashFiles('omp-versions.json', 'test/drill/corpus.json') }}
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run src/cli.ts matrix --corpus corpus.json --versions omp-versions.json --include-latest --report report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.os }}
          path: report.json

  # Untrusted plugin code runs here and only here: no token permissions, no cache
  # (so it cannot poison what the trusted job reads), and no secret access.
  runtime-untrusted:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions: {}
    env:
      OMP_COMPAT_DISPOSABLE_RUNNER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run src/cli.ts matrix --corpus corpus.json --versions omp-versions.json --include-latest --trust untrusted --checks manifest,omp-load --untrusted-runtime --report report-runtime-untrusted.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-runtime-untrusted-${{ matrix.os }}
          path: report-runtime-untrusted.json
